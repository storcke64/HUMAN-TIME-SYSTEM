<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Time System (HTS) Year Converter</title>
    <style>
        /* Modern, Clean Styling (Same as before) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 30px; /* Added space below main container */
        }
        /* New styling for the future calculator section */
        #future-calc {
            background-color: #e6f7ff; /* Slightly different background for visual separation */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 25px;
        }
        .logo-container img {
            max-width: 180px; 
            height: auto;
            display: block;
            margin: 0 auto;
        }
        h1, h2 {
            color: #1a1a2e;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            margin-top: 30px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 700;
        }
        #result, #future-result {
            margin-top: 35px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            font-size: 1.1em;
            color: #1a1a2e;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="hts-logo-main.png" alt="Human Time System Logo">
    </div>

    <h1>Gregorian Year to HTS Converter</h1>

    <label for="gregorianYear">Enter Gregorian Year (AD):</label>
    <input type="number" id="gregorianYear" placeholder="e.g., 2025" value="2025">

    <button onclick="convertToHTS()">Calculate HTS Time</button>

    <div id="result">
        Enter a year to see the HTS conversion.
    </div>
</div>
<div id="future-calc">
    <h2>Future HTS Year Calculator</h2>
    <p style="color: #555;">Calculate the HTS designation for X years in the future, starting from the current Gregorian year (2025 AD).</p>

    <label for="yearsInFuture">Enter Years From Current Year (X):</label>
    <input type="number" id="yearsInFuture" placeholder="e.g., 1000" value="1000">

    <button onclick="calculateFutureHTS()">Calculate Future HTS Time</button>

    <div id="future-result">
        Enter a number of years to see the future HTS conversion.
    </div>
</div>
<script>
    // --- HTS Conversion Constants ---
    const BASE_GREGORIAN_YEAR = 2023; 
    const HTS_BASE_YEAR = 40000;     
    const EPOCH_LENGTH = 50000;       
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const CURRENT_GREGORIAN_YEAR = 2025; // Define current year for future calculation

    // The core conversion logic, now encapsulated in a reusable function
    function performHTSConversion(targetYear) {
        // HTS Year 0 is 40000 years before 2023 AD
        const HTS_YEAR_0_GREGORIAN = BASE_GREGORIAN_YEAR - HTS_BASE_YEAR;
        
        // Calculate the total number of years passed since HTS Year 0
        const yearsSinceHTS0 = targetYear - HTS_YEAR_0_GREGORIAN;

        // Determine the Epoch index (0 for A, 1 for B, etc.)
        const epochIndex = Math.floor(yearsSinceHTS0 / EPOCH_LENGTH);

        // Determine the HTS Year within that Epoch
        const yearWithinEpoch = yearsSinceHTS0 % EPOCH_LENGTH;
        
        // Determine the Supercycle number (1-based index)
        const supercycleNumber = Math.floor(epochIndex / ALPHABET.length) + 1;
        
        // Determine the Epoch letter (A-Z)
        const letterIndex = epochIndex % ALPHABET.length;
        const epochLetter = ALPHABET[letterIndex];

        // Format the HTS Result
        const HTS_Year_Formatted = String(yearWithinEpoch).padStart(5, '0');
        const HTS_Epoch_Year = `${epochLetter}${HTS_Year_Formatted}`;
        const HTS_Full = `${supercycleNumber}${epochLetter}${HTS_Year_Formatted}`;
        
        return { HTS_Epoch_Year, HTS_Full, targetYear };
    }


    // Function for the Main Converter (Gregorian Year to HTS)
    function convertToHTS() {
        const yearInput = document.getElementById('gregorianYear').value;
        const resultDiv = document.getElementById('result');
        const gregorianYear = parseInt(yearInput);

        if (isNaN(gregorianYear) || gregorianYear < (BASE_GREGORIAN_YEAR - HTS_BASE_YEAR)) {
            resultDiv.innerHTML = "❌ Please enter a valid Gregorian year.";
            return;
        }

        const result = performHTSConversion(gregorianYear);

        resultDiv.innerHTML = `
            <h3>✅ Conversion Complete</h3>
            <p>The Gregorian Year ${result.targetYear} AD is:</p>
            <p style="font-size: 2.5em; color: #007bff; margin: 10px 0;">
                ${result.HTS_Epoch_Year}
            </p>
            <p>Full HTS Notation (Supercycle/Epoch/Year):</p>
            <p style="font-size: 1.5em; color: #1a1a2e; margin: 5px 0;">
                **${result.HTS_Full}**
            </p>
        `;
    }

    // Function for the New Future Year Calculator
    function calculateFutureHTS() {
        const yearsInput = document.getElementById('yearsInFuture').value;
        const resultDiv = document.getElementById('future-result');
        const yearsInFuture = parseInt(yearsInput);

        if (isNaN(yearsInFuture) || yearsInFuture < 0) {
            resultDiv.innerHTML = "❌ Please enter a valid number of years.";
            return;
        }

        // Calculate the target future Gregorian year
        const targetFutureYear = CURRENT_GREGORIAN_YEAR + yearsInFuture;

        const result = performHTSConversion(targetFutureYear);

        resultDiv.innerHTML = `
            <h3>✅ Future Calculation</h3>
            <p>The year **${yearsInFuture}** years from now (${targetFutureYear} AD) is:</p>
            <p style="font-size: 2.5em; color: #007bff; margin: 10px 0;">
                ${result.HTS_Epoch_Year}
            </p>
            <p>Full HTS Notation (Supercycle/Epoch/Year):</p>
            <p style="font-size: 1.5em; color: #1a1a2e; margin: 5px 0;">
                **${result.HTS_Full}**
            </p>
        `;
    }
    
    // Run the main calculation on load for the default year (2025)
    document.addEventListener('DOMContentLoaded', convertToHTS);
</script>

</body>
</html>
