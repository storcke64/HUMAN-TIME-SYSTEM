<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Time System (HTS) Year Converter</title>
    <style>
        /* Modern, Clean Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        /* Logo Styling */
        .logo-container {
            margin-bottom: 25px;
        }
        .logo-container img {
            max-width: 180px; 
            height: auto;
            display: block;
            margin: 0 auto;
        }
        h1 {
            color: #1a1a2e;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            margin-top: 30px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 700;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.99);
        }
        #result {
            margin-top: 35px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #e6f7ff;
            font-size: 1.1em;
            color: #1a1a2e;
            font-weight: bold;
        }
        /* Footer/New Logo Styling */
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .storcke-logo img {
            max-width: 150px;
            height: auto;
            opacity: 0.7; /* Subtly integrated */
        }
        .footer-text {
            color: #666;
            font-size: 0.8em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="1000035855.png" alt="Human Time System Logo">
    </div>

    <h1>Gregorian Year to HTS Converter</h1>

    <label for="gregorianYear">Enter Gregorian Year (AD):</label>
    <input type="number" id="gregorianYear" placeholder="e.g., 2025">
    <button onclick="convertToHTS()">Calculate HTS Year</button>

    <div id="result">
        Enter a year to see the HTS conversion.
    </div>
</div>

<footer>
    <div class="storcke-logo">
        <img src="storcke_hts_logo.png" alt="Storcke HTS Tool">
    </div>
    <p class="footer-text">Powered by the Storcke Family Products HTS Tool</p>
</footer>

<script>
    // --- New Code Block for Default Year ---
    document.addEventListener('DOMContentLoaded', () => {
        const currentYear = new Date().getFullYear();
        const yearInput = document.getElementById('gregorianYear');
        
        // 1. Set the default value to the current year
        yearInput.value = currentYear;
        
        // 2. Run the conversion immediately using the current year
        convertToHTS();
    });

    function convertToHTS() {
        const yearInput = document.getElementById('gregorianYear').value;
        const resultDiv = document.getElementById('result');
        const gregorianYear = parseInt(yearInput);

        if (isNaN(gregorianYear) || gregorianYear < -40000) {
            resultDiv.innerHTML = "❌ Please enter a valid Gregorian year (e.g., 2025). The system starts 40,000 years before 2023.";
            return;
        }

        // --- HTS Conversion Constants ---
        const BASE_GREGORIAN_YEAR = 2023; // Gregorian year that corresponds to HTS Year 40,000
        const HTS_BASE_YEAR = 40000;      // HTS Year for 2023 AD
        const EPOCH_LENGTH = 50000;       // Years per Epoch (A to Z)
        
        // Latin alphabet for Epoch representation (A is index 0)
        const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        // 1. Calculate the Total HTS Year since HTS Year 0
        const totalHTSYear = HTS_BASE_YEAR + (gregorianYear - BASE_GREGORIAN_YEAR);

        // 2. Determine Epoch and Year within Epoch
        
        const HTS_YEAR_0_GREGORIAN = BASE_GREGORIAN_YEAR - HTS_BASE_YEAR; // -37977
        const yearsSinceHTS0 = gregorianYear - HTS_YEAR_0_GREGORIAN;

        const epochIndex = Math.floor(yearsSinceHTS0 / EPOCH_LENGTH);
        const yearWithinEpoch = yearsSinceHTS0 % EPOCH_LENGTH;
        
        const supercycleNumber = Math.floor(epochIndex / ALPHABET.length) + 1;
        
        const letterIndex = epochIndex % ALPHABET.length;
        const epochLetter = ALPHABET[letterIndex];

        // Format the HTS Result
        const HTS_Year_Formatted = String(yearWithinEpoch).padStart(5, '0');
        const HTS_Epoch_Year = `${epochLetter}${HTS_Year_Formatted}`;
        
        // Full Supercycle/Epoch notation (e.g., 1A40002)
        const HTS_Full = `${supercycleNumber}${epochLetter}${HTS_Year_Formatted}`;


        resultDiv.innerHTML = `
            <h3>✅ Conversion Complete</h3>
            <p>The Gregorian Year ${gregorianYear} AD is:</p>
            <p style="font-size: 2.5em; color: #007bff; margin: 10px 0;">
                ${HTS_Epoch_Year}
            </p>
            <p>Full HTS Notation (Supercycle/Epoch/Year):</p>
            <p style="font-size: 1.5em; color: #1a1a2e; margin: 5px 0;">
                **${HTS_Full}**
            </p>
        `;
    }
    
</script>

</body>
</html>
